name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify generated Pigeon APIs
        run: |
          dart run pigeon --input pigeons/cithub_api.dart
          git diff --exit-code -- lib/core/native/cithub_api.g.dart packages/cithub_native/android/src/main/kotlin/com/aquasofts/cithub_flutter/native/CithubApi.g.kt
      - name: Analyze and test Flutter
        run: |
          flutter analyze
          flutter test --coverage
      - name: Kotlin tests and Android lint
        working-directory: android
        run: ./gradlew :cithub_native:testManualCaptchaDebugUnitTest :cithub_native:testAutoCaptchaDebugUnitTest lint

  integration-android:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Android integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test --flavor manualCaptcha

  release-apks:
    runs-on: ubuntu-latest
    needs: [verify, integration-android]
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_STORE_FILE: ../.ci/release.jks
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Restore production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p .ci
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .ci/release.jks
      - name: Build ARM64 R8 release APKs
        run: |
          flutter pub get
          flutter build apk --release --flavor autoCaptcha --target-platform android-arm64
          flutter build apk --release --flavor manualCaptcha --target-platform android-arm64
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-autocaptcha-release.apk "artifacts/Cithub-Flutter-$version-auto-captcha-performance.apk"
          cp build/app/outputs/flutter-apk/app-manualcaptcha-release.apk "artifacts/Cithub-Flutter-$version-manual-captcha-performance.apk"
      - name: Verify APK identity, signer, alignment, ABI, and flavor split
        run: |
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          expected_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          expected_code="$(sed -n 's/^version: [^+]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)"
          for apk in artifacts/*.apk; do
            badging="$("$build_tools/aapt" dump badging "$apk")"
            test "$(printf '%s\n' "$badging" | sed -n "s/package: name='\([^']*\)'.*/\1/p")" = com.aquasofts.cithub_flutter
            test "$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)" = "$expected_version"
            test "$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)" = "$expected_code"
            test "$(printf '%s\n' "$badging" | sed -n "s/sdkVersion:'\([^']*\)'.*/\1/p")" = 26
            test "$(printf '%s\n' "$badging" | sed -n "s/targetSdkVersion:'\([^']*\)'.*/\1/p")" = 35
            test "$(printf '%s\n' "$badging" | sed -n "s/native-code: '\([^']*\)'.*/\1/p")" = arm64-v8a
            if "$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'android:debuggable.*0xffffffff'; then exit 1; fi
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            cert="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1)"
            test "${cert,,}" = "${EXPECTED_CERT_SHA256,,}"
            "$build_tools/zipalign" -c -P 16 4 "$apk"
            if zipinfo -1 "$apk" | grep -E '^lib/(armeabi-v7a|x86|x86_64)/'; then exit 1; fi
          done
          auto_apk="$(find artifacts -name '*-auto-captcha-performance.apk')"
          manual_apk="$(find artifacts -name '*-manual-captcha-performance.apk')"
          zipinfo -1 "$auto_apk" | grep -qi mlkit
          if zipinfo -1 "$manual_apk" | grep -qi mlkit; then exit 1; fi
          shasum -a 256 artifacts/*.apk | tee artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cithub-flutter-android-release
          path: artifacts/
          if-no-files-found: error
